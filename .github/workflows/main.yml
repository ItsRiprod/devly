name: Publish Mod

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Load publishing keys
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          MODTALE_KEY: op://HytaleCI/Modtale/credential
          CURSE_KEY: op://HytaleCI/CurseForge/credential
          MODIFOLD_KEY: op://HytaleCI/Modifold/credential
          MAVEN_USERNAME: op://HytaleCI/Maven/username
          MAVEN_PASSWORD: op://HytaleCI/Maven/credential

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build artifacts
        run: ./gradlew build -Dorg.gradle.java.home="$JAVA_HOME"

      - name: Publish enabled platforms
        run: ./gradlew publishAll -Dorg.gradle.java.home="$JAVA_HOME"

 
